---
# Global variables for all hosts

# User configuration
setup_user: samuel
home_dir: "/home/{{ setup_user }}"
setup_repo: "{{ home_dir }}/git/setups/linux-setup"
setup_repo_private: "{{ home_dir }}/git/setups/linux-setup-private"
dotfiles_dir: "{{ setup_repo }}/dotfiles"
configure_grub_windows_first: true

# Home LAN connection — the corporate VPN (roles/wifec_vpn) claims itself as the DNS resolver
# for every domain once connected, so this connection needs an explicit per-domain override to
# keep the home network's own hostnames (AdGuard rewrites, homeserver repo) resolving via the
# LAN's own resolver instead of the VPN's, without touching the VPN's own DNS behavior at all.
wifec_vpn_lan_connection: "Wired connection 1"
wifec_vpn_lan_ifname: "enp0s31f6"
wifec_vpn_lan_dns_override_domain: "casanovacatalan.duckdns.org"

# Location-aware VPN switching (roles/home_wireguard) — home LAN, office WiFi, and "elsewhere"
# each need a different combination of the corporate OpenVPN (wifec) and a personal WireGuard
# VPN back to the home network active. See roles/home_wireguard/templates/vpn-location-toggle.sh.j2
# for the actual state logic; these are just the identifiers it keys off.
office_wifi_ssid: "IMMFLY GROUP"
wifi_ifname: "wlp0s20f3"
home_wireguard_conn_name: "HomeWireGuard"
home_wireguard_client_config_path: "{{ setup_repo_private }}/home-wireguard/laptop.conf"

# SMB/CIFS network shares, persisted via /etc/fstab + systemd automount
# (see roles/smb_mount). Credentials for each entry must exist at
# {{ setup_repo_private }}/smb/creds/<name> with contents:
#   username=youruser
#   password=yourpassword
#   domain=WORKGROUP
smb_mount_default_uid: 1000
smb_mount_default_gid: 1000
smb_mounts:
  - name: samuel
    src: "//192.168.1.2/Samuel"
    path: /mnt/smb

# Basic system packages
basic_packages:
  - tree
  - stow
  - vim
  - build-essential
  - software-properties-common
  - apt-transport-https
  - ca-certificates
  - gnupg

# Networking tools
networking_tools:
  - inetutils-traceroute
  - net-tools
  - nmap
  - curl
  - wget

# VS Code extensions
vscode_extensions:
  - Orta.vscode-jest
  - dbaeumer.vscode-eslint
  - esbenp.prettier-vscode
  - nicoespeon.abracadabra
  - SonarSource.sonarlint-vscode
  - eamodio.gitlens
  - smcpeak.default-keys-windows
  - GitLab.gitlab-workflow
  - pkief.material-icon-theme
  - usernamehw.errorlens
  - ms-python.python
  - ms-python.mypy-type-checker
  - anthropic.claude-code

# Node.js versions to install via NVM
node_versions:
  - v22
  - v20
  - v18
  - v16.16.0
  - v10

# Docker configuration
docker_users:
  - "{{ setup_user }}"

# Browsers to install
browsers:
  - google-chrome-stable

# Personal Repositories
personal_repositories:
  - { name: 'codely-aggregates-course', repo: 'git@github.com:CodelyTV/aggregates-course.git' }
  - { name: 'codely-typescript-ddd-example', repo: 'git@github.com:CodelyTV/typescript-ddd-example.git' }
  - { name: 'ddd-course-codelytv', repo: 'git@github.com:samuelcasanova/ddd-course-codelytv.git' }
  - { name: 'elasticsearch-codelytv-course', repo: 'git@github.com:samuelcasanova/elasticsearch-codelytv-course.git' }
  - { name: 'samuelcasanova.github.io', repo: 'git@github.com:samuelcasanova/samuelcasanova.github.io.git' }

