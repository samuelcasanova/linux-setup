---
# Global variables for all hosts

# User configuration
setup_user: samuel
home_dir: "/home/{{ setup_user }}"
setup_repo: "{{ home_dir }}/git/setups/linux-setup"
setup_repo_private: "{{ home_dir }}/git/setups/linux-setup-private"
dotfiles_dir: "{{ setup_repo }}/dotfiles"
configure_grub_windows_first: true

# Home LAN connection — the corporate VPN (roles/wifec_vpn) claims itself as the DNS resolver
# for every domain once connected, so this connection needs an explicit per-domain override to
# keep the home network's own hostnames (AdGuard rewrites, homeserver repo) resolving via the
# LAN's own resolver instead of the VPN's, without touching the VPN's own DNS behavior at all.
wifec_vpn_lan_connection: "Wired connection 1"
wifec_vpn_lan_ifname: "enp0s31f6"
wifec_vpn_lan_dns_override_domain: "casanovacatalan.duckdns.org"

# Location-aware VPN switching (roles/home_wireguard) — only WireGuard (back to the home
# network) is toggled by location: down at home (redundant, already on the LAN), up everywhere
# else. Corporate OpenVPN (wifec) is intentionally NOT part of this — it stays always-on via its
# own systemd unit (roles/wifec_vpn) regardless of location. An earlier version of this toggled
# wifec off on office WiFi too, on the theory office WiFi already gives full corporate access —
# that assumption was wrong; wifec needs to stay on even at the office. See
# roles/home_wireguard/templates/vpn-location-toggle.sh.j2 for the actual state logic.

# Every subdomain of casanovacatalan.duckdns.org proxied through NPM (homeserver repo, README
# Step 18+) — add a line here whenever a new one gets proxied. This can't be a single wildcard
# covering the whole domain: the WireGuard endpoint itself is casanovacatalan.duckdns.org, so a
# routing rule covering the bare apex creates a deadlock (can't resolve the endpoint without the
# tunnel, can't establish the tunnel without resolving the endpoint) — confirmed live, the tunnel
# came up but nothing worked until this was narrowed to exact subdomains. A "subdomains-only,
# excludes the apex" syntax (`~.domain`) was tried and confirmed live NOT to register as a
# routing domain at all on this system (NetworkManager 1.46.0) — resolvectl showed nothing bound
# to the interface even with the tunnel fully connected. This enumerated list is what's actually
# proven to work.
# Each already carries the "~" routing-domain marker nmcli/systemd-resolved need, so the task
# that consumes this list is just a plain join(',') — no regex/transformation required.
home_wireguard_proxied_subdomains:
  - "~vault.casanovacatalan.duckdns.org"
  - "~home.casanovacatalan.duckdns.org"
  - "~photos.casanovacatalan.duckdns.org"
  - "~frigate.casanovacatalan.duckdns.org"
  - "~adguard.casanovacatalan.duckdns.org"
  - "~uptime.casanovacatalan.duckdns.org"
  - "~ha.casanovacatalan.duckdns.org"
  - "~wireguard.casanovacatalan.duckdns.org"
  - "~backrest.casanovacatalan.duckdns.org"
  - "~npm.casanovacatalan.duckdns.org"
  - "~finance.casanovacatalan.duckdns.org"
  - "~finance-import.casanovacatalan.duckdns.org"
home_wireguard_conn_name: "HomeWireGuard"
home_wireguard_client_config_path: "{{ setup_repo_private }}/home-wireguard/laptop.conf"

# SMB/CIFS network shares, persisted via /etc/fstab + systemd automount
# (see roles/smb_mount). Credentials for each entry must exist at
# {{ setup_repo_private }}/smb/creds/<creds> (<creds> defaults to <name>) with contents:
#   username=youruser
#   password=yourpassword
#   domain=WORKGROUP
smb_mount_default_uid: 1000
smb_mount_default_gid: 1000
smb_mounts:
  - name: samuel
    src: "//192.168.1.2/Samuel"
    path: /mnt/smb
  - name: music
    src: "//192.168.1.2/Music"
    path: /mnt/smb-music
    creds: samuel
  - name: pictures
    src: "//192.168.1.2/Pictures"
    path: /mnt/smb-pictures
    creds: samuel
  - name: videos
    src: "//192.168.1.2/Videos"
    path: /mnt/smb-videos
    creds: samuel

# Home folders replaced by symlinks into the shares above, mirroring the Windows machines'
# known-folder redirects (windows-setup: support-files/network-folders.psd1).
home_folder_links:
  - name: Documents
    target: /mnt/smb/Documents
  - name: Music
    target: /mnt/smb-music/samuel/Music
  - name: Pictures
    target: /mnt/smb-pictures
  - name: Videos
    target: /mnt/smb-videos

# Basic system packages
basic_packages:
  - tree
  - stow
  - vim
  - build-essential
  - software-properties-common
  - apt-transport-https
  - ca-certificates
  - gnupg

# Networking tools
networking_tools:
  - inetutils-traceroute
  - net-tools
  - nmap
  - curl
  - wget

# VS Code extensions
vscode_extensions:
  - Orta.vscode-jest
  - dbaeumer.vscode-eslint
  - esbenp.prettier-vscode
  - nicoespeon.abracadabra
  - SonarSource.sonarlint-vscode
  - eamodio.gitlens
  - smcpeak.default-keys-windows
  - GitLab.gitlab-workflow
  - pkief.material-icon-theme
  - usernamehw.errorlens
  - ms-python.python
  - ms-python.mypy-type-checker
  - anthropic.claude-code

# Node.js versions to install via NVM
node_versions:
  - v22
  - v20
  - v18
  - v16.16.0
  - v10

# Docker configuration
docker_users:
  - "{{ setup_user }}"

# Browsers to install
browsers:
  - google-chrome-stable

# Personal Repositories
personal_repositories:
  - { name: 'codely-aggregates-course', repo: 'git@github.com:CodelyTV/aggregates-course.git' }
  - { name: 'codely-typescript-ddd-example', repo: 'git@github.com:CodelyTV/typescript-ddd-example.git' }
  - { name: 'ddd-course-codelytv', repo: 'git@github.com:samuelcasanova/ddd-course-codelytv.git' }
  - { name: 'elasticsearch-codelytv-course', repo: 'git@github.com:samuelcasanova/elasticsearch-codelytv-course.git' }
  - { name: 'samuelcasanova.github.io', repo: 'git@github.com:samuelcasanova/samuelcasanova.github.io.git' }

# Immfly Repositories
# Every repository in the IFEC registry is cloned under the folder of its tier;
# immfly_repositories is only for the ones not yet in the registry.
immfly_dir: '{{ home_dir }}/git/immfly'
immfly_ai_context_repo: 'git@git.immfly.com:immfly/shared/wifec-platform-ai-context.git'
immfly_ai_context_dir: '{{ immfly_dir }}/wifec-platform-ai-context'
immfly_tier_dirs:
  air: airside
  ground: groundside
  shared: shared
  off-platform: off-platform
immfly_repositories: []
