# Role: safeeyes
# Description: SafeEyes configuration and dotfiles
# Migrated from: install-software-scripts/80-safeeyes.sh (config part)

- name: Create directory for apt keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Download SafeEyes PPA key
  shell: |
    curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3CA9236CC08B02848B45F40D8BF5CC8A8802F482" | gpg --dearmor -o /etc/apt/keyrings/safeeyes.gpg
  args:
    creates: /etc/apt/keyrings/safeeyes.gpg
  become: yes

- name: Add SafeEyes PPA
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/safeeyes.gpg] https://ppa.launchpadcontent.net/safeeyes-team/safeeyes/ubuntu {{ ansible_distribution_release }} main"
    state: present
    filename: safeeyes
  become: yes

- name: Install SafeEyes
  apt:
    name: safeeyes
    state: present
    update_cache: yes
  become: yes

- name: Check if SafeEyes configuration files are real files
  stat:
    path: "{{ item }}"
  loop:
    - "{{ home_dir }}/.config/safeeyes"
    - "{{ home_dir }}/.config/autostart/io.github.slgobinath.SafeEyes.desktop"
  register: safeeyes_stats

- name: Backup existing SafeEyes configuration
  command: mv {{ item.item }} /tmp/
  args:
    removes: "{{ item.item }}"
  loop: "{{ safeeyes_stats.results }}"
  when: item.stat.exists and not item.stat.islnk
  failed_when: false

- name: Deploy SafeEyes dotfiles
  command: stow -v -d {{ setup_repo }}/dotfiles/ -t {{ home_dir }} safeeyes
  register: stow_safeeyes
  changed_when: "'LINK' in (stow_safeeyes.stderr | default(''))"
