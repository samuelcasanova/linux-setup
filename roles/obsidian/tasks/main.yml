# Role: obsidian
# Description: Obsidian installation and vault setup
# Migrated from: install-software-scripts/61-obsidian.sh

# The GitHub "latest" release is often an Android-only build with no desktop
# assets, so scan recent releases for the newest one shipping an amd64 deb.
- name: Get recent Obsidian releases from GitHub
  uri:
    url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases?per_page=30
    return_content: yes
  register: obsidian_releases

- name: Find deb installer URL
  set_fact:
    obsidian_deb_url: "{{ obsidian_releases.json | rejectattr('prerelease') | map(attribute='assets') | flatten | selectattr('name', 'search', 'amd64\\.deb$') | map(attribute='browser_download_url') | first }}"

- name: Download Obsidian deb
  get_url:
    url: "{{ obsidian_deb_url }}"
    dest: "/tmp/obsidian.deb"

- name: Install Obsidian
  apt:
    deb: "/tmp/obsidian.deb"
  become: yes

- name: Ensure git directory exists
  file:
    path: "{{ home_dir }}/git"
    state: directory

- name: Clone secondbrain repository
  git:
    repo: "git@github.com:samuelcasanova/secondbrain.git"
    dest: "{{ home_dir }}/git/secondbrain"
    accept_hostkey: yes
    key_file: "{{ home_dir }}/.ssh/id_ed25519"
