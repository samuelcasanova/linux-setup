# Role: kde
# Description: KDE Desktop configuration and dotfiles
# Migrated from: install-software-scripts/14-kde.sh

# Without a desktop metapackage do-release-upgrade runs in server mode and mishandles the Plasma transition
- name: Install the Kubuntu desktop metapackage without its recommended apps
  apt:
    name: kubuntu-desktop
    state: present
    install_recommends: no
  become: yes

- name: Create KDE backup directory
  file:
    path: /tmp/kde/.config
    state: directory
    mode: '0755'

- name: Check if KDE configuration files are real files
  stat:
    path: "{{ home_dir }}/.config/{{ item }}"
  loop:
    - discoverrc
    - dolphinrc
    - kdeglobals
    - kglobalshortcutsrc
    - konsolerc
    - konsolesshconfig
    - plasmarc
    - ksmserverrc
    - kwinrc
    - kscreenlockerrc
    - klipperrc
    - plasmashellrc
    - powerdevilrc
  register: kde_file_stats

- name: Backup existing KDE configuration files
  command: mv {{ home_dir }}/.config/{{ item.item }} /tmp/kde/.config/
  args:
    removes: "{{ home_dir }}/.config/{{ item.item }}"
  loop: "{{ kde_file_stats.results }}"
  when: item.stat.exists and not item.stat.islnk
  failed_when: false

- name: Check if KDE configuration directories are real directories
  stat:
    path: "{{ item }}"
  loop:
    - "{{ home_dir }}/.config/xsettingsd"
    - "{{ home_dir }}/.local/share/konsole"
  register: kde_dir_stats

- name: Backup existing KDE configuration directories
  command: mv {{ item.item }} /tmp/kde/
  args:
    removes: "{{ item.item }}"
  loop: "{{ kde_dir_stats.results }}"
  when: item.stat.exists and not item.stat.islnk
  failed_when: false

- name: Deploy KDE dotfiles
  command: stow -v -d {{ setup_repo }}/dotfiles/ -t {{ home_dir }} kde
  args:
    chdir: "{{ setup_repo }}/dotfiles"
  register: stow_kde
  changed_when: "'LINK' in (stow_kde.stderr | default(''))"

- name: Check if the desktop wallpaper is already set
  command: grep -q desktop-background.jpg {{ home_dir }}/.config/plasma-org.kde.plasma.desktop-appletsrc
  register: kde_wallpaper_check
  changed_when: false
  failed_when: false

- name: Set the desktop wallpaper
  command: plasma-apply-wallpaperimage {{ home_dir }}/desktop-background.jpg
  when: kde_wallpaper_check.rc != 0
  failed_when: false # Needs a running Plasma session, so it fails in Docker tests
