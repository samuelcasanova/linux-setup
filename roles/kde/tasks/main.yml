# Role: kde
# Description: KDE Desktop configuration and dotfiles
# Migrated from: install-software-scripts/14-kde.sh

# Without a desktop metapackage do-release-upgrade runs in server mode and mishandles the Plasma transition
- name: Install the Kubuntu desktop metapackage without its recommended apps
  apt:
    name: kubuntu-desktop
    state: present
    install_recommends: no
  become: yes

- name: Create KDE backup directory
  file:
    path: /tmp/kde/.config
    state: directory
    mode: '0755'

- name: Check if KDE configuration files are real files
  stat:
    path: "{{ home_dir }}/.config/{{ item }}"
  loop:
    - dolphinrc
    - kdeglobals
    - kglobalshortcutsrc
    - konsolerc
    - konsolesshconfig
    - plasmarc
    - ksmserverrc
    - kwinrc
    - kscreenlockerrc
    - klipperrc
    - plasmashellrc
    - powerdevilrc
  register: kde_file_stats

- name: Backup existing KDE configuration files
  command: mv {{ home_dir }}/.config/{{ item.item }} /tmp/kde/.config/
  args:
    removes: "{{ home_dir }}/.config/{{ item.item }}"
  loop: "{{ kde_file_stats.results }}"
  when: item.stat.exists and not item.stat.islnk
  failed_when: false

- name: Check if KDE configuration directories are real directories
  stat:
    path: "{{ item }}"
  loop:
    - "{{ home_dir }}/.local/share/konsole"
  register: kde_dir_stats

- name: Backup existing KDE configuration directories
  command: mv {{ item.item }} /tmp/kde/
  args:
    removes: "{{ item.item }}"
  loop: "{{ kde_dir_stats.results }}"
  when: item.stat.exists and not item.stat.islnk
  failed_when: false

- name: Remove links to KDE dotfiles dropped from the repo
  command: find {{ home_dir }}/.config {{ home_dir }}/.local/share -maxdepth 1 -xtype l -lname '*/dotfiles/kde/*' -print -delete
  register: kde_stale_links
  changed_when: kde_stale_links.stdout != ''

- name: Deploy KDE dotfiles
  command: stow -v -d {{ setup_repo }}/dotfiles/ -t {{ home_dir }} kde
  args:
    chdir: "{{ setup_repo }}/dotfiles"
  register: stow_kde
  changed_when: "'LINK' in (stow_kde.stderr | default(''))"

- name: Read the Plasma desktop layout
  slurp:
    src: "{{ home_dir }}/.config/plasma-org.kde.plasma.desktop-appletsrc"
  register: kde_appletsrc
  failed_when: false

# Each screen has its own desktop containment, and plasma-apply-wallpaperimage only reaches the ones
# that exist when it runs, so a monitor plugged in later keeps the default wallpaper until the next run
- name: Set the desktop wallpaper on every screen
  command: plasma-apply-wallpaperimage {{ home_dir }}/desktop-background.jpg
  vars:
    appletsrc: "{{ kde_appletsrc.content | default('') | b64decode }}"
    desktop_count: "{{ appletsrc | regex_findall('(?m)^plugin=org\\.kde\\.(?:plasma\\.folder|desktop)$') | length }}"
    wallpaper_count: "{{ appletsrc | regex_findall('(?m)^Image=file://.*/desktop-background\\.jpg$') | length }}"
  when: desktop_count | int == 0 or wallpaper_count | int < desktop_count | int
  ignore_errors: yes # Needs a running Plasma session, so it fails in Docker tests
