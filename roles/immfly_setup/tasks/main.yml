---
- name: Ensure Immfly directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ [immfly_dir] | product(immfly_tier_dirs.values()) | map('join', '/') | list }}"

- name: Install make
  apt:
    name: make
    state: present
  become: yes

- name: Clone the IFEC platform AI context
  git:
    repo: "{{ immfly_ai_context_repo }}"
    dest: "{{ immfly_ai_context_dir }}"
    accept_hostkey: yes

- name: Read the IFEC service registry
  slurp:
    src: "{{ immfly_ai_context_dir }}/skills/ifec-service-map/registry.yaml"
  register: immfly_registry_file

# The registry is parsed with awk upstream and is not valid YAML (free-text desc fields hold
# unquoted colons), so only the name, repo and tier lines are fed to from_yaml.
- name: Parse the IFEC service registry
  set_fact:
    immfly_registry_services: "{{ (immfly_registry_file.content | b64decode).splitlines()
      | select('match', ' *(- name|repo|tier):') | join('\n') | from_yaml }}"

- name: Clone Immfly repositories from the registry
  git:
    repo: "{{ item.repo }}"
    dest: "{{ immfly_dir }}/{{ immfly_tier_dirs[item.tier] }}/{{ item.name }}"
    accept_hostkey: yes
  loop: "{{ immfly_registry_services | rejectattr('repo', 'equalto', immfly_ai_context_repo) | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Clone Immfly repositories not yet in the registry
  git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    accept_hostkey: yes
  loop: "{{ immfly_repositories }}"

- name: Private repo configurations
  block:
    - name: Check if private repo exists
      stat:
        path: "{{ setup_repo_private }}"
      register: private_repo_stat

    - name: Run setup-wifec.sh from private repo
      command: "{{ setup_repo_private }}/immfly-wifec/setup-wifec.sh"
      when: private_repo_stat.stat.exists

    - name: Copy .npmrc for ife-app
      copy:
        src: "{{ setup_repo_private }}/immfly-wifec/ife-app/.npmrc"
        dest: "{{ immfly_dir }}/{{ immfly_tier_dirs.air }}/ife-app/.npmrc"
        remote_src: yes
      when: private_repo_stat.stat.exists

    - name: Ensure .docker directory exists
      file:
        path: "{{ home_dir }}/.docker"
        state: directory
        mode: '0700'
      when: private_repo_stat.stat.exists

    - name: Configure Immfly docker registry
      file:
        src: "{{ setup_repo_private }}/dotfiles/docker/config.json"
        dest: "{{ home_dir }}/.docker/config.json"
        state: link
        force: yes
      when: private_repo_stat.stat.exists
