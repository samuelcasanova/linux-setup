---
- name: Install dependencies for OpenVPN 3
  apt:
    name:
      - apt-transport-https
      - curl
    state: present
  become: yes

- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Add OpenVPN 3 repository key
  get_url:
    url: https://packages.openvpn.net/packages-repo.gpg
    dest: /etc/apt/keyrings/openvpn.asc
    mode: '0644'
  become: yes

- name: Add OpenVPN 3 repository
  copy:
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/openvpn.asc] https://packages.openvpn.net/openvpn3/debian {{ ansible_distribution_release }} main\n"
    dest: /etc/apt/sources.list.d/openvpn-packages.list
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Install OpenVPN 3
  apt:
    name: openvpn3
    state: present
    update_cache: yes
  become: yes
  when: not ansible_check_mode

- name: Install wifecvpn systemd service
  become: yes
  when: not ansible_check_mode
  block:
    - name: Deploy wifecvpn.service from template
      template:
        src: wifecvpn.service.j2
        dest: /etc/systemd/system/wifecvpn.service
        mode: '0644'
      register: vpn_service_file

    - name: Reload systemd
      systemd:
        daemon_reload: yes
      when: vpn_service_file.changed

    - name: Enable and start wifecvpn service
      systemd:
        name: wifecvpn
        enabled: yes
        state: started
      failed_when: false # Might fail if the .ovpn file in the private repo doesn't exist yet

# This VPN (openvpn3-linux) claims itself as the resolver for *every* domain
# (systemd-resolved's "~." routing domain) once connected, regardless of the
# `route ... net_gateway` exclusion already added for the home LAN subnet in
# the .ovpn file — routing and DNS-domain-scope are separate mechanisms, and
# the IP route alone doesn't stop DNS lookups for home-LAN hostnames from
# being sent to the VPN's own DNS server (which has no idea about them and
# just returns the domain's real public record instead). Rather than fight
# the VPN's own DNS behavior (risking breaking corporate resolution), this
# adds a narrow, persistent per-domain override on the LAN connection itself:
# only casanovacatalan.duckdns.org and its subdomains get routed to the LAN's
# own resolver (AdGuard, homeserver repo) regardless of what the VPN claims
# for everything else — every other domain keeps resolving via the VPN
# exactly as before, completely untouched.
- name: Ensure the LAN connection routes the home domain to AdGuard, not the corporate VPN's DNS
  community.general.nmcli:
    conn_name: "{{ wifec_vpn_lan_connection }}"
    ifname: "{{ wifec_vpn_lan_ifname }}"
    type: ethernet
    dns4_search:
      - "~{{ wifec_vpn_lan_dns_override_domain }}"
    state: present
  become: yes
