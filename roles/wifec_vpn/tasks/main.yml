---
- name: Install dependencies for OpenVPN 3
  apt:
    name:
      - apt-transport-https
      - curl
    state: present
  become: yes

- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Add OpenVPN 3 repository key
  get_url:
    url: https://packages.openvpn.net/packages-repo.gpg
    dest: /etc/apt/keyrings/openvpn.asc
    mode: '0644'
  become: yes

- name: Add OpenVPN 3 repository
  copy:
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/openvpn.asc] https://packages.openvpn.net/openvpn3/debian {{ ansible_facts['distribution_release'] }} main\n"
    dest: /etc/apt/sources.list.d/openvpn-packages.list
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Install OpenVPN 3
  apt:
    name: openvpn3
    state: present
    update_cache: yes
  become: yes
  when: not ansible_check_mode

- name: Remove the legacy wifecvpn oneshot unit
  become: yes
  when: not ansible_check_mode
  block:
    - name: Disable wifecvpn.service
      systemd:
        name: wifecvpn
        enabled: no
        state: stopped
      failed_when: false

    - name: Delete wifecvpn.service
      file:
        path: /etc/systemd/system/wifecvpn.service
        state: absent
      register: legacy_vpn_unit

    - name: Reload systemd after removing wifecvpn.service
      systemd:
        daemon_reload: yes
      when: legacy_vpn_unit.changed

- name: Check for the wifec VPN profile in the private repo
  stat:
    path: "{{ setup_repo_private }}/immfly-wifec/vpn/wifec-open-vpn-config.ovpn"
  register: wifec_ovpn

# openvpn3-session@.service tracks the session itself, so systemd sees a dropped tunnel instead of
# reporting "active (exited)" forever like the old oneshot unit did. It only starts persistent
# profiles imported by name, and auth-user-pass gets inlined at import, so any change to the
# profile or credentials files needs a re-import.
- name: Run the wifec VPN as an openvpn3 systemd session
  become: yes
  when: wifec_ovpn.stat.exists and not ansible_check_mode
  vars:
    wifec_vpn_profile: wifec
    wifec_vpn_profile_dir: /etc/openvpn3/wifec
  block:
    - name: Stage the wifec profile and its credential files
      copy:
        src: "{{ setup_repo_private }}/immfly-wifec/vpn/"
        dest: "{{ wifec_vpn_profile_dir }}/"
        owner: root
        group: root
        mode: '0600'
        directory_mode: '0700'
      register: wifec_profile_files

    - name: List imported openvpn3 profiles
      command: openvpn3 configs-list
      register: openvpn3_configs
      changed_when: false

    - name: Check whether the wifec profile is already imported
      set_fact:
        wifec_profile_imported: "{{ openvpn3_configs.stdout_lines | select('match', wifec_vpn_profile ~ '\\s') | list | length > 0 }}"

    - name: Remove the outdated wifec profile
      command: openvpn3 config-remove --config {{ wifec_vpn_profile }} --force
      when: wifec_profile_imported and wifec_profile_files.changed

    - name: Import the wifec profile as persistent
      command: openvpn3 config-import --persistent --name {{ wifec_vpn_profile }} --config {{ wifec_vpn_profile_dir }}/wifec-open-vpn-config.ovpn
      when: not wifec_profile_imported or wifec_profile_files.changed
      register: wifec_profile_import

    - name: Ensure the wifec session drop-in directory exists
      file:
        path: /etc/systemd/system/openvpn3-session@{{ wifec_vpn_profile }}.service.d
        state: directory
        mode: '0755'

    # openvpn3-systemd exits 0 when the session ends, so Restart=on-failure would never fire.
    - name: Restart the wifec session whenever it ends
      copy:
        content: |
          [Service]
          Restart=always
          RestartSec=15
        dest: /etc/systemd/system/openvpn3-session@{{ wifec_vpn_profile }}.service.d/restart.conf
        mode: '0644'
      register: wifec_session_dropin

    - name: Reload systemd after the drop-in changes
      systemd:
        daemon_reload: yes
      when: wifec_session_dropin.changed

    - name: Enable and start the wifec session
      systemd:
        name: openvpn3-session@{{ wifec_vpn_profile }}
        enabled: yes
        state: "{{ 'restarted' if wifec_profile_import.changed or wifec_session_dropin.changed else 'started' }}"

# This VPN (openvpn3-linux) claims itself as the resolver for *every* domain
# (systemd-resolved's "~." routing domain) once connected. An IP route can't
# fix that — routing and DNS-domain-scope are separate mechanisms, so lookups
# for home-LAN hostnames still go to the VPN's own DNS server (which has no
# idea about them and just returns the domain's real public record instead).
# Rather than fight
# the VPN's own DNS behavior (risking breaking corporate resolution), this
# adds a narrow, persistent per-domain override on the LAN connection itself:
# only casanovacatalan.duckdns.org and its subdomains get routed to the LAN's
# own resolver (AdGuard, homeserver repo) regardless of what the VPN claims
# for everything else — every other domain keeps resolving via the VPN
# exactly as before, completely untouched.
- name: Ensure the LAN connection routes the home domain to AdGuard, not the corporate VPN's DNS
  community.general.nmcli:
    conn_name: "{{ wifec_vpn_lan_connection }}"
    ifname: "{{ wifec_vpn_lan_ifname }}"
    type: ethernet
    dns4_search:
      - "~{{ wifec_vpn_lan_dns_override_domain }}"
    state: present
  become: yes
