---
# Role: os_basics
# Description: Basic OS configuration and essential tools
# Migrated from: install-software-scripts/00-os-basics.sh

- name: Create GRUB backup directory
  file:
    path: /tmp/grub.d
    state: directory
    mode: '0755'
  become: yes

- name: Backup current GRUB configuration
  copy:
    src: /etc/grub.d/
    dest: /tmp/grub.d/
    remote_src: yes
    mode: preserve
  become: yes
  register: grub_backup
  failed_when: false

- name: Check if os-prober exists at default location
  stat:
    path: /etc/grub.d/30_os-prober
  register: os_prober_default

# grub-common reinstalls 30_os-prober on release upgrades, so a stale 09 copy must be overwritten
- name: Move os-prober to boot Windows first (if exists)
  command: mv -f /etc/grub.d/30_os-prober /etc/grub.d/09_os-prober
  become: yes
  when: os_prober_default.stat.exists

- name: Check if os-prober is in place to boot Windows first
  stat:
    path: /etc/grub.d/09_os-prober
  register: os_prober_first

# The rename alone does not rewrite grub.cfg, so the generated config has to be what decides
# whether to regenerate. Notifying off the rename instead leaves grub.cfg stale forever once
# 09_os-prober is already in place, which is how this drifted in the first place.
- name: Read the generated GRUB config
  slurp:
    src: /boot/grub/grub.cfg
  register: grub_cfg
  become: yes
  when: os_prober_first.stat.exists

- name: Regenerate GRUB so Windows is the first menu entry
  command: grub-mkconfig -o /boot/grub/grub.cfg
  become: yes
  when:
    - os_prober_first.stat.exists
    - "'/etc/grub.d/09_os-prober' not in (grub_cfg.content | b64decode)"

- name: Install basic system packages
  apt:
    name: "{{ basic_packages }}"
    state: present
    update_cache: yes
  become: yes

- name: Install networking tools and dependencies
  apt:
    name: "{{ networking_tools }}"
    state: present
  become: yes

- name: Configure passwordless sudo for setup user
  lineinfile:
    path: /etc/sudoers.d/{{ setup_user }}-nopasswd
    line: "{{ setup_user }} ALL=(ALL) NOPASSWD: ALL"
    create: yes
    mode: '0440'
    validate: 'visudo -cf %s'
  become: yes
